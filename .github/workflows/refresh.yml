name: Refresh ledger data

on:
  schedule:
    # Every 6 hours (UTC). TZ below keeps snapshot dates on Sydney time.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh snapshots and rebuild toolkit
        env:
          TZ: Australia/Sydney
        run: python3 src/refresh_data.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes - nothing to publish."
          else
            git commit -m "Scheduled data refresh"
            git push
          fi
